name: align-farm-charm-1-1-19
on:
  push:
    branches: [farm-charm-matching-bakery]
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Replace Farm & Charm with Bakery-compatible 1.1.19 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src/main/java/net/satisfy/farm_and_charm src/main/java/net/satisfy/foundation
          git clone --filter=blob:none https://github.com/Let-s-Do-Collection/FarmAndCharm.git /tmp/fc
          cd /tmp/fc
          git fetch origin f11720e3608f0f604d1a32c6e6b6e2855a92b4f1
          git checkout f11720e3608f0f604d1a32c6e6b6e2855a92b4f1
          cd -
          cp -R /tmp/fc/common/src/main/java/net/satisfy/farm_and_charm src/main/java/net/satisfy/
          cp -R /tmp/fc/neoforge/src/main/java/net/satisfy/farm_and_charm/. src/main/java/net/satisfy/farm_and_charm/
          mkdir -p src/main/resources/assets/whatsits src/main/resources/data/whatsits
          cp -R /tmp/fc/common/src/main/resources/assets/farm_and_charm/. src/main/resources/assets/whatsits/
          cp -R /tmp/fc/common/src/main/resources/data/farm_and_charm/. src/main/resources/data/whatsits/
          cp -R /tmp/fc/neoforge/src/main/resources/. src/main/resources/
          rm -f src/main/java/net/satisfy/farm_and_charm/neoforge/FarmAndCharmNeoForge.java
          git checkout d90fdbaa220c4185ac2f111660082ba9b38c0bc1 -- src/main/java/net/satisfy/bakery
          rm -rf src/main/java/net/satisfy/bakery/core/compat/jei src/main/java/net/satisfy/bakery/core/compat/rei src/main/java/net/satisfy/bakery/neoforge/core/rei
          rm -rf src/main/java/net/satisfy/farm_and_charm/core/compat/jei src/main/java/net/satisfy/farm_and_charm/core/compat/rei src/main/java/net/satisfy/farm_and_charm/neoforge/core/rei
          rm -rf src/main/java/net/satisfy/foundation
          find src/main/resources -type f \( -name "farm_and_charm-common.mixins.json" -o -name "FarmAndCharm-neoforge.mixins.json" -o -name "fabric.mod.json" \) -delete || true
          python3 - <<'PY'
          from pathlib import Path
          for root in [Path("src/main/java/net/satisfy/farm_and_charm"), Path("src/main/resources/assets/whatsits"), Path("src/main/resources/data/whatsits")]:
              for p in root.rglob("*"):
                  if p.is_file():
                      try: s=p.read_text()
                      except UnicodeDecodeError: continue
                      s=s.replace("farm_and_charm:", "whatsits:")
                      s=s.replace('"farm_and_charm"', '"whatsits"')
                      s=s.replace("MOD_ID = \"farm_and_charm\"", "MOD_ID = net.moonlitmistletoe.whatsits.Whatsits.MOD_ID")
                      p.write_text(s)
          PY
          git rm -r --ignore-unmatch src/main/java/net/satisfy/foundation src/main/java/net/satisfy/bakery/core/compat/jei src/main/java/net/satisfy/bakery/core/compat/rei src/main/java/net/satisfy/bakery/neoforge/core/rei src/main/java/net/satisfy/farm_and_charm/core/compat/jei src/main/java/net/satisfy/farm_and_charm/core/compat/rei src/main/java/net/satisfy/farm_and_charm/neoforge/core/rei || true
          git add -A
          git config user.name "MoonlightMelodies"
          git config user.email "moonlitmistletoe@gmail.com"
          git commit -m "Use Farm & Charm 1.1.19 source compatible with Bakery"
          git push origin HEAD:farm-charm-matching-bakery