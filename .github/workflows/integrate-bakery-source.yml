name: integrate-bakery-source

on:
  push:
    branches:
      - bakery-source-import

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import and adapt Bakery source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf src/main/java/net/satisfy/bakery src/main/resources/assets/whatsits src/main/resources/data/whatsits
          rm -rf /tmp/bakery-extract
          mkdir -p /tmp/bakery-extract

          git show 107595c909422a035caff898abe82962aa229b7a:bakery-1.21.1.zip > /tmp/bakery.zip
          unzip -q /tmp/bakery.zip -d /tmp/bakery-extract
          BAKERY_ROOT="$(find /tmp/bakery-extract -maxdepth 1 -mindepth 1 -type d | head -n1)"

          mkdir -p src/main/java/net/satisfy
          cp -R "$BAKERY_ROOT/common/src/main/java/net/satisfy/bakery" src/main/java/net/satisfy/
          mkdir -p src/main/java/net/satisfy/bakery
          cp -R "$BAKERY_ROOT/neoforge/src/main/java/net/satisfy/bakery/neoforge" src/main/java/net/satisfy/bakery/

          mkdir -p src/main/resources/assets/whatsits
          cp -R "$BAKERY_ROOT/common/src/main/resources/assets/bakery/." src/main/resources/assets/whatsits/
          rm -rf src/main/resources/assets/whatsits/models/item src/main/resources/assets/whatsits/textures/item

          mkdir -p src/main/resources/data/whatsits
          cp -R "$BAKERY_ROOT/common/src/main/resources/data/bakery/." src/main/resources/data/whatsits/
          rm -rf src/main/resources/data/whatsits/recipe src/main/resources/data/whatsits/advancement src/main/resources/data/whatsits/loot_table src/main/resources/data/whatsits/tags/item

          python3 - <<'PY'
          from pathlib import Path
          import json, re, shutil

          root = Path("src/main/java/net/satisfy/bakery")

          # Remove platform/source files that cannot be part of a NeoForge-only Morrow source tree.
          for p in list(root.rglob("*.java")):
              s = p.read_text(errors="ignore")
              if "net.satisfy.farm_and_charm" in s or "net.fabricmc." in s or "me.shedaniel.rei." in s:
                  p.unlink()

          # Remove item, recipe and compatibility layers entirely.
          for rel in ["core/item", "core/compat", "core/recipe", "core/effect"]:
              p = root / rel
              if p.exists():
                  shutil.rmtree(p)

          # Bakery itself is now a component of Morrow, not a second mod.
          p = root / "Bakery.java"
          p.write_text('''package net.satisfy.bakery;

          import net.minecraft.resources.ResourceLocation;
          import net.moonlitmistletoe.whatsits.Whatsits;
          import net.satisfy.bakery.core.registry.ObjectRegistry;
          import net.satisfy.bakery.core.registry.SoundEventRegistry;

          public final class Bakery {
              public static final String MOD_ID = Whatsits.MOD_ID;

              public static ResourceLocation identifier(String name) {
                  return ResourceLocation.fromNamespaceAndPath(MOD_ID, name);
              }

              public static void init() {
                  ObjectRegistry.init();
                  SoundEventRegistry.init();
              }
          }
          ''')

          # The Fabric/common client implementation is not used by Morrow.
          (root / "client/BakeryClient.java").write_text('''package net.satisfy.bakery.client;

          public final class BakeryClient {
              public static void preInitClient() {}
              public static void initClient() {}
          }
          ''')

          # Build a Bakery block-only registry from the real source registry.
          # Anything whose implementation depended on Farm & Charm was removed above.
          original = Path("/tmp/bakery-extract").rglob("common/src/main/java/net/satisfy/bakery/core/registry/ObjectRegistry.java")
          original = next(original)
          src = original.read_text()

          block_lines = []
          for line in src.splitlines():
              if "public static final RegistrySupplier<Block>" not in line:
                  continue
              m = re.search(r'new ([A-Za-z0-9_]+)\\(', line)
              if not m:
                  continue
              cls = m.group(1)
              candidates = list(root.rglob(cls + ".java"))
              if not candidates:
                  continue
              # Block entities are omitted from the stripped Bakery layer.
              impl = candidates[0].read_text(errors="ignore")
              if "EntityBlock" in impl or "BlockEntity" in impl:
                  continue
              # The Farm & Charm furniture blocks are deliberately not imported.
              if "net.satisfy.farm_and_charm" in impl:
                  continue
              if "registerWithItem" in line:
                  # The three-argument jam registrations require an item remainder.
                  if line.count(",") >= 2:
                      continue
                  line = line.replace("registerWithItem", "registerWithoutItem")
              block_lines.append(line)

          header = '''package net.satisfy.bakery.core.registry;

          import dev.architectury.registry.registries.DeferredRegister;
          import dev.architectury.registry.registries.Registrar;
          import dev.architectury.registry.registries.RegistrySupplier;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.SoundType;
          import net.minecraft.world.level.block.state.BlockBehaviour;
          import net.minecraft.world.level.block.state.properties.NoteBlockInstrument;
          import net.satisfy.bakery.Bakery;
          import net.satisfy.bakery.core.block.*;
          import net.satisfy.bakery.core.block.cake.*;
          import java.util.function.Supplier;

          public final class ObjectRegistry {
              private static final DeferredRegister<Block> BLOCKS =
                      DeferredRegister.create(Bakery.MOD_ID, Registries.BLOCK);
              private static final Registrar<Block> BLOCK_REGISTRAR = BLOCKS.getRegistrar();

          '''
          # The original cake registrations referenced removed item suppliers.
          body = "\n".join(block_lines)
          body = re.sub(r'ObjectRegistry\\.[A-Z0-9_]+_SLICE', 'null', body)
          body = re.sub(r'\\(\\s*ObjectRegistry\\.[A-Z0-9_]+\\s*\\)', '(null)', body)

          footer = '''
              public static void init() {
                  BLOCKS.register();
              }

              public static <T extends Block> RegistrySupplier<T> registerWithoutItem(String name, Supplier<T> block) {
                  return BLOCKS.register(Bakery.identifier(name), block);
              }
          }
          '''
          (root / "core/registry/ObjectRegistry.java").write_text(header + body + footer)

          # No Bakery block entities remain in the stripped layer.
          (root / "core/registry/EntityTypeRegistry.java").write_text(
              "package net.satisfy.bakery.core.registry;\npublic final class EntityTypeRegistry { public static void init() {} }\n"
          )
          (root / "core/registry/CompostableRegistry.java").write_text(
              "package net.satisfy.bakery.core.registry;\npublic final class CompostableRegistry { public static void registerCompostable() {} }\n"
          )
          (root / "core/registry/TabRegistry.java").write_text(
              "package net.satisfy.bakery.core.registry;\npublic final class TabRegistry { public static void init() {} }\n"
          )
          (root / "core/registry/RecipeTypeRegistry.java").write_text(
              "package net.satisfy.bakery.core.registry;\npublic final class RecipeTypeRegistry { public static void init() {} }\n"
          )
          (root / "core/event/CommonEvents.java").write_text(
              "package net.satisfy.bakery.core.event;\npublic final class CommonEvents { public static void init() {} }\n"
          )

          # Remove the second mod entrypoint - Whatsits is the only @Mod entrypoint.
          p = root / "neoforge/BakeryNeoForge.java"
          if p.exists():
              p.unlink()

          # Client registration belongs to Morrow's mod id through Bakery.MOD_ID.
          p = root / "neoforge/client/BakeryClientNeoForge.java"
          if p.exists():
              s = p.read_text()
              s = s.replace("bus = EventBusSubscriber.Bus.MOD", "bus = EventBusSubscriber.Bus.MOD")
              p.write_text(s)

          # Remove item language entries. Block translations remain.
          lang = Path("src/main/resources/assets/whatsits/lang/en_us.json")
          if lang.exists():
              data = json.loads(lang.read_text())
              data = {k:v for k,v in data.items() if not k.startswith("item.bakery.") and not k.startswith("item.whatsits.")}
              lang.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("build.gradle")
          s=p.read_text()
          s=re.sub(r'def bakeryGeneratedRoot =.*?\nrepositories \{', 'repositories {', s, flags=re.S)
          s=re.sub(r'\n?tasks\.withType\(\s*JavaCompile\s*\)\.configureEach\s*\{.*?\n\}', '', s, flags=re.S)
          s=re.sub(r'\ntasks\.named\(\s*"processResources"\s*\)\.configure\s*\{.*?\n\}\n\nidea \{', '\nidea {', s, flags=re.S)
          p.write_text(s)
          PY

          ./gradlew --no-daemon compileJava

          git config user.name "MoonlightMelodies"
          git config user.email "manifestedmoonlight@gmail.com"
          git add -A
          git commit -m "Import Bakery source without Bakery items"
          git push origin HEAD:bakery-source-import
