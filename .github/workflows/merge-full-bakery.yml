name: merge-full-bakery

on:
  push:
    branches:
      - bakery-full-merge

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge Lets Do Bakery source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bakery-extract
          mkdir -p /tmp/bakery-extract
          git show 107595c909422a035caff898abe82962aa229b7a:bakery-1.21.1.zip > /tmp/bakery.zip
          unzip -q /tmp/bakery.zip -d /tmp/bakery-extract
          ROOT="$(find /tmp/bakery-extract -maxdepth 1 -mindepth 1 -type d | head -n1)"

          rm -rf src/main/java/net/satisfy/bakery
          mkdir -p src/main/java/net/satisfy
          cp -R "$ROOT/common/src/main/java/net/satisfy/bakery" src/main/java/net/satisfy/

          if [ -d "$ROOT/neoforge/src/main/java/net/satisfy/bakery" ]; then
            cp -R "$ROOT/neoforge/src/main/java/net/satisfy/bakery/." src/main/java/net/satisfy/bakery/
          fi

          rm -rf src/main/resources/assets/whatsits src/main/resources/data/whatsits
          mkdir -p src/main/resources/assets/whatsits src/main/resources/data/whatsits
          cp -R "$ROOT/common/src/main/resources/assets/bakery/." src/main/resources/assets/whatsits/
          cp -R "$ROOT/common/src/main/resources/data/bakery/." src/main/resources/data/whatsits/

          # Bakery is part of Morrow, so use Morrow's namespace rather than registering a second mod.
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("src/main/java/net/satisfy/bakery")
          p=root/"Bakery.java"
          s=p.read_text()
          s=s.replace('public static final String MOD_ID = "bakery";',
                      'public static final String MOD_ID = net.moonlitmistletoe.whatsits.Whatsits.MOD_ID;')
          p.write_text(s)

          for p in root.rglob("*.java"):
              s=p.read_text(errors="ignore")
              s=s.replace('Bakery.MOD_ID', 'Bakery.MOD_ID')
              p.write_text(s)

          for base in [Path("src/main/resources/assets/whatsits"), Path("src/main/resources/data/whatsits")]:
              for p in base.rglob("*"):
                  if p.is_file():
                      try:
                          s=p.read_text()
                      except UnicodeDecodeError:
                          continue
                      s=s.replace('"bakery:', '"whatsits:')
                      s=s.replace('bakery:', 'whatsits:')
                      s=s.replace('namespace": "bakery"', 'namespace": "whatsits"')
                      p.write_text(s)
          PY

          # Do not add Bakery's standalone NeoForge @Mod entrypoint.
          rm -f src/main/java/net/satisfy/bakery/neoforge/BakeryNeoForge.java

          git add -A
          git config user.name "MoonlightMelodies"
          git config user.email "manifestedmoonlight@gmail.com"
          git commit -m "Fully merge Lets Do Bakery source"
          git push origin HEAD:bakery-full-merge
