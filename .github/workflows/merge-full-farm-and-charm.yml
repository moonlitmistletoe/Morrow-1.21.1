name: merge-full-farm-and-charm
on:
  push:
    branches: [farm-charm-full-merge]
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Merge Farm & Charm source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fc
          mkdir -p /tmp/fc
          git clone --depth 1 --branch 1.21.1 https://github.com/Let-s-Do-Collection/FarmAndCharm.git /tmp/fc/repo
          rm -rf src/main/java/net/satisfy/foundation src/main/java/net/satisfy/farm_and_charm
          git clone --depth 1 --branch 1.21.1 https://github.com/Let-s-Do-Collection/Foundation.git /tmp/foundation
          cp -R /tmp/foundation/common/src/main/java/net/satisfy/foundation src/main/java/net/satisfy/
          if [ -d /tmp/foundation/neoforge/src/main/java/net/satisfy/foundation ]; then
            cp -R /tmp/foundation/neoforge/src/main/java/net/satisfy/foundation/. src/main/java/net/satisfy/foundation/
          fi
          rm -rf src/main/java/net/satisfy/farm_and_charm
          cp -R /tmp/fc/repo/common/src/main/java/net/satisfy/farm_and_charm src/main/java/net/satisfy/
          if [ -d /tmp/fc/repo/neoforge/src/main/java/net/satisfy/farm_and_charm ]; then
            cp -R /tmp/fc/repo/neoforge/src/main/java/net/satisfy/farm_and_charm/. src/main/java/net/satisfy/farm_and_charm/
          fi
          mkdir -p src/main/resources/assets/whatsits src/main/resources/data/whatsits
          if [ -d /tmp/foundation/common/src/main/resources ]; then cp -R /tmp/foundation/common/src/main/resources/. src/main/resources/; fi
          if [ -d /tmp/foundation/neoforge/src/main/resources ]; then cp -R /tmp/foundation/neoforge/src/main/resources/. src/main/resources/; fi
          cp -R /tmp/fc/repo/common/src/main/resources/assets/farm_and_charm/. src/main/resources/assets/whatsits/ || true
          cp -R /tmp/fc/repo/common/src/main/resources/data/farm_and_charm/. src/main/resources/data/whatsits/ || true
          if [ -d /tmp/fc/repo/neoforge/src/main/resources ]; then
            cp -R /tmp/fc/repo/neoforge/src/main/resources/. src/main/resources/
          fi
          python3 - <<'PY'
          from pathlib import Path
          for p in Path("src/main").rglob("*"):
            if p.is_file():
              try: s=p.read_text()
              except UnicodeDecodeError: continue
              s=s.replace("farm_and_charm:", "whatsits:")
              s=s.replace('"farm_and_charm"', '"whatsits"')
              s=s.replace('MOD_ID = "farm_and_charm"', 'MOD_ID = net.moonlitmistletoe.whatsits.Whatsits.MOD_ID')
              p.write_text(s)
          PY
          rm -f src/main/java/net/satisfy/farm_and_charm/neoforge/FarmAndCharmNeoForge.java
          find src/main/resources -type f \( -name "neoforge.mods.toml" -o -name "fabric.mod.json" \) -delete || true
          git add -A
          git config user.name "MoonlightMelodies"
          git config user.email "moonlitmistletoe@gmail.com"
          git commit -m "Fully merge Lets Do Farm & Charm source"
          git push origin HEAD:farm-charm-full-merge